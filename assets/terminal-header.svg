<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#090e1a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .term-text { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
      .prompt { fill: #38bdf8; font-weight: 700; font-size: 13px; }
      .cmd { fill: #f8fafc; font-weight: 500; font-size: 13px; }
      .lbl { fill: #818cf8; font-weight: 600; font-size: 12.5px; }
      .arr { fill: #06b6d4; font-size: 12.5px; }
      .val { fill: #e2e8f0; font-size: 12.5px; }
      .highlight { fill: #34d399; font-weight: 600; font-size: 12.5px; }
      .cursor {
        fill: #38bdf8;
        animation: blink 1.1s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .online-dot {
        fill: #10b981;
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { r: 4px; opacity: 0.9; }
        50% { r: 6px; opacity: 0.4; }
        100% { r: 4px; opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="1" y="1" width="918" height="278" rx="10" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="918" height="278" rx="10" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Title Bar -->
  <path d="M 1 11 Q 1 1 11 1 L 909 1 Q 919 1 919 11 L 919 38 L 1 38 Z" fill="url(#headerGrad)"/>
  <line x1="1" y1="38" x2="919" y2="38" stroke="#334155" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="24" cy="19" r="6" fill="#ef4444"/>
  <circle cx="44" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="19" r="6" fill="#10b981"/>

  <!-- Window Title -->
  <text x="460" y="24" text-anchor="middle" class="term-text" fill="#94a3b8" font-size="12" letter-spacing="0.5">
    readuanul@neural-core: ~/engineering-dossier (zsh)
  </text>

  <!-- Live Status Pill -->
  <circle cx="820" cy="19" r="4" class="online-dot"/>
  <text x="832" y="23" class="term-text" fill="#10b981" font-size="11" font-weight="600" letter-spacing="0.5">ONLINE</text>

  <!-- Terminal Body Lines -->
  <!-- Line 1: Command Entry -->
  <g transform="translate(28, 64)">
    <text class="term-text prompt">readuanul@neural-core:~$</text>
    <text x="210" y="0" class="term-text cmd">init --agent --profile "Readuanul Farid Fahim"</text>
  </g>

  <!-- Line 2: Identity -->
  <g transform="translate(42, 90)">
    <text class="term-text lbl">NAME</text>
    <text x="120" y="0" class="term-text arr">➜</text>
    <text x="140" y="0" class="term-text val" font-weight="700" fill="#ffffff">Readuanul Farid Fahim</text>
    <text x="325" y="0" class="term-text highlight">[Verified AI Engineer]</text>
  </g>

  <!-- Line 3: Title -->
  <g transform="translate(42, 114)">
    <text class="term-text lbl">ROLE</text>
    <text x="120" y="0" class="term-text arr">➜</text>
    <text x="140" y="0" class="term-text val">AI Engineer &amp; Machine Learning Systems Architect</text>
  </g>

  <!-- Line 4: Education -->
  <g transform="translate(42, 138)">
    <text class="term-text lbl">ACADEMICS</text>
    <text x="120" y="0" class="term-text arr">➜</text>
    <text x="140" y="0" class="term-text val">B.Sc. in Computer Science &amp; Engineering <tspan fill="#38bdf8" font-weight="600">(Major: ML &amp; AI)</tspan> • North South University</text>
  </g>

  <!-- Line 5: Core Specialties -->
  <g transform="translate(42, 162)">
    <text class="term-text lbl">SPECIALTIES</text>
    <text x="120" y="0" class="term-text arr">➜</text>
    <text x="140" y="0" class="term-text val">Autonomous RAG Agents • Computer Vision (YOLOv5, OpenCV) • Deep Learning (PyTorch)</text>
  </g>

  <!-- Line 6: Applied Stacks -->
  <g transform="translate(42, 186)">
    <text class="term-text lbl">INTELLIGENCE</text>
    <text x="120" y="0" class="term-text arr">➜</text>
    <text x="140" y="0" class="term-text val">Supabase pgvector Semantic Search • n8n Workflow Hubs • Explainable AI (LIME)</text>
  </g>

  <!-- Line 7: Operational Edge -->
  <g transform="translate(42, 210)">
    <text class="term-text lbl">OPS EDGE</text>
    <text x="120" y="0" class="term-text arr">➜</text>
    <text x="140" y="0" class="term-text val">Aviation Operations Precision <tspan fill="#94a3b8">(US-Bangla Airlines)</tspan> ➔ 99.9% Production Reliability Discipline</text>
  </g>

  <!-- Line 8: Deployment Status Prompt -->
  <g transform="translate(28, 240)">
    <text class="term-text prompt">readuanul@neural-core:~$</text>
    <text x="210" y="0" class="term-text cmd">check-systems --all</text>
  </g>

  <!-- Line 9: Status Result with blinking cursor -->
  <g transform="translate(42, 262)">
    <text class="term-text highlight">● 12 AI &amp; Engineering Systems Deployed</text>
    <text x="315" y="0" class="term-text val">| Open for AI Engineering &amp; Autonomous Systems Roles</text>
    <rect x="795" y="-12" width="9" height="15" class="cursor"/>
  </g>
</svg>
