<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="80">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <style>
      .term-f-text { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
      .prompt { fill: #38bdf8; font-weight: 700; font-size: 13px; }
      .cmd { fill: #f8fafc; font-weight: 500; font-size: 13px; }
      .status { fill: #34d399; font-weight: 600; font-size: 12px; }
      .meta { fill: #94a3b8; font-size: 12px; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="918" height="78" rx="8" fill="url(#footerBg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="918" height="78" rx="8" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Command Line -->
  <g transform="translate(24, 30)">
    <text class="term-f-text prompt">readuanul@neural-core:~$</text>
    <text x="210" y="0" class="term-f-text cmd">echo "Let's architect the future of intelligent systems together."</text>
  </g>

  <!-- Output Status -->
  <g transform="translate(24, 58)">
    <circle cx="6" cy="-4" r="4" fill="#10b981"/>
    <text x="18" y="0" class="term-f-text status">SYSTEM READY</text>
    <text x="135" y="0" class="term-f-text meta">| Session 0x7F4A • Dhaka, Bangladesh • Readuanulfaridfahim1@gmail.com</text>
  </g>
</svg>
